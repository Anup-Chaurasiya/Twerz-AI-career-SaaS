<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twerz Apply Assist</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="capture-flow.css" />
</head>
<body>
  <div class="popup-shell">
    <div class="ab-brand">
      <img id="brandLogo" alt="Twerz" width="36" height="36" />
      <div class="ab-brand-text">
        <span class="ab-brand-name">Twerz</span>
        <span class="ab-brand-sub">Apply Assist</span>
      </div>
    </div>

    <div id="auth-panel">
      <div class="alert alert-info">Connect once — capture JDs, get fit scores, fill apply forms. You always submit.</div>
      <button type="button" class="btn btn-primary" id="connect">Connect Twerz account</button>
      <button type="button" class="advanced-toggle" id="toggleAdvanced">Advanced: API URLs</button>
      <div class="advanced-panel" id="advancedPanel">
        <div class="field">
          <label for="appBase">Web app URL</label>
          <input id="appBase" value="http://localhost:3000" />
        </div>
        <div class="field">
          <label for="apiBase">API URL</label>
          <input id="apiBase" value="http://localhost:8000" />
        </div>
      </div>
      <p class="hint" id="authStatus"></p>
    </div>

    <div id="capture-panel">
      <div class="connected-bar">
        <span class="connected-email" id="connected-as"></span>
        <button type="button" class="advanced-toggle" id="disconnect" style="margin:0;text-decoration:none;color:#f87171;">Disconnect</button>
      </div>

      <div id="pageStatus" class="status-pill status-pill--idle">Checking page…</div>
      <p class="page-context" id="pageContext"></p>
      <div id="pageAlert" class="alert alert-warn" style="display:none;"></div>

      <div class="field">
        <label for="profileId">Profile</label>
        <select id="profileId"></select>
      </div>
      <div class="field">
        <label for="company">Company</label>
        <input id="company" placeholder="e.g. Acme Corp" autocomplete="off" />
      </div>
      <div class="field">
        <label for="role">Role</label>
        <input id="role" placeholder="e.g. Senior Backend Engineer" autocomplete="off" />
      </div>
      <div class="field">
        <label for="description">Job description</label>
        <textarea id="description" placeholder="Paste or edit the full job description here…"></textarea>
        <div class="field-meta" id="descMeta"><span>Min 20 characters</span><span id="descCount">0</span></div>
      </div>

      <button type="button" class="btn btn-primary" id="capture" disabled>Capture &amp; analyze fit</button>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="refresh">Re-scan page</button>
        <button type="button" class="btn btn-secondary" id="openDashboard">Dashboard</button>
      </div>
      <p class="hint" id="status"></p>
    </div>

    <div id="results-panel" style="display:none;">
      <div class="connected-bar">
        <span class="connected-email" id="results-connected-as"></span>
        <button type="button" class="advanced-toggle" id="backToCapture" style="margin:0;text-decoration:none;">← Capture</button>
      </div>
      <div id="results-content"></div>
    </div>
  </div>
  <script src="jd-extract.js"></script>
  <script src="form-utils.js"></script>
  <script src="telemetry.js"></script>
  <script src="capture-flow.js"></script>
  <script src="popup.js"></script>
</body>
</html>
