<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ATS Beater Capture</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 12px; }
    label { display: block; font-size: 12px; margin-top: 8px; }
    input, textarea, select { width: 100%; box-sizing: border-box; margin-top: 4px; }
    textarea { height: 100px; }
    button { margin-top: 12px; width: 100%; padding: 8px; }
    .hint { font-size: 11px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Capture job</h3>
  <label>API token <input id="token" type="password" placeholder="Paste JWT from ATS Beater" /></label>
  <label>Profile ID <input id="profileId" type="number" placeholder="e.g. 1" /></label>
  <label>Company <input id="company" /></label>
  <label>Role <input id="role" /></label>
  <label>Description <textarea id="description"></textarea></label>
  <button id="capture">Create job in ATS Beater</button>
  <p class="hint" id="warn" style="display:none;color:#b45309;"></p>
  <p class="hint" id="status">Supports LinkedIn, Naukri, and Indeed. Paste JWT from the web app.</p>
  <label>API base <input id="apiBase" value="http://localhost:8000" /></label>
  <script src="popup.js"></script>
</body>
</html>
