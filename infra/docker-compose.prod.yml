# Production stack for Oracle Cloud VM — API only (database: Supabase).
# Usage: docker compose -f infra/docker-compose.prod.yml up -d
#
# Set DATABASE_URL in .env to your Supabase direct connection (port 5432).
# First deploy: RUN_MIGRATIONS=true in .env, then ./infra/deploy-oracle.sh --migrate

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    volumes:
      # Mount host OCI API key config (generated on VM via `oci setup config`)
      - ${OCI_CONFIG_DIR:-${HOME}/.oci}:/root/.oci:ro
    environment:
      OCI_CONFIG_PATH: /root/.oci/config
      LATEX_BIN_PATH: /usr/bin
      PORT: "8080"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
