# Nginx reverse proxy for Twerz API on Oracle VM.
# Install: sudo cp infra/nginx/twerz-api.conf /etc/nginx/sites-available/twerz-api
#          sudo sed -i 's/api.yourdomain.com/api.YOUR_DOMAIN/' /etc/nginx/sites-available/twerz-api
#          sudo ln -sf /etc/nginx/sites-available/twerz-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # SSE progress streams
        proxy_buffering off;
        proxy_cache off;
    }
}
